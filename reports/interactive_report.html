<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Steam 성공 예측 인터랙티브 리포트</title>
<style>
body { font-family: Arial, sans-serif; margin: 28px; color: #111827; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
.card { border: 1px solid #d1d5db; border-radius: 10px; padding: 16px; margin: 14px 0; }
.bar-row { display: grid; grid-template-columns: 180px 1fr 90px; gap: 10px; align-items: center; margin: 8px 0; }
.bar-bg { background: #e5e7eb; border-radius: 999px; overflow: hidden; height: 18px; }
.bar { background: #2563eb; height: 18px; }
.figure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.figure-grid img { max-width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; }
.topic-table { width: 100%; border-collapse: collapse; }
.topic-table th, .topic-table td { border-bottom: 1px solid #e5e7eb; padding: 8px; text-align: left; vertical-align: top; }
.small { color: #6b7280; font-size: 0.92em; }
</style>
</head>
<body>
<h1>Steam 출시 성공 예측 인터랙티브 리포트</h1>
<p>체크박스로 분석 기준을 선택하면 장르, 가격대, 플랫폼, 외부 관심도 등 기준별 성공률 그래프가 표시됩니다.</p>
<div id="summary"></div>
<div class="card"><h2>결론</h2><h3>간략 버전</h3><p id="briefConclusion"></p><h3>상세 버전</h3><p id="detailConclusion"></p></div>
<div class="card" id="predictedGame"></div>
<div class="card"><h2>시각화</h2><div class="figure-grid" id="figures"></div></div>
<div class="card"><h2>성공확률 상위 장르 리뷰 토픽</h2><div id="reviewTopics"></div></div>
<div class="controls" id="controls"></div>
<div id="sections"></div>
<script>
const data = {"labels": {"genre": "장르", "category": "상점 카테고리/기능", "price_band": "가격대", "language_band": "지원 언어 수", "platform_count": "지원 플랫폼 수", "multiplayer": "멀티플레이 여부", "external_attention": "외부 웹 관심도"}, "sections": {"genre": [{"criteria": "genre", "criteria_value": "Casual", "game_count": 29, "success_count": 22, "success_rate": 0.7586206896551724}, {"criteria": "genre", "criteria_value": "Simulation", "game_count": 65, "success_count": 47, "success_rate": 0.7230769230769231}, {"criteria": "genre", "criteria_value": "Adventure", "game_count": 82, "success_count": 58, "success_rate": 0.7073170731707317}, {"criteria": "genre", "criteria_value": "Strategy", "game_count": 47, "success_count": 33, "success_rate": 0.7021276595744681}, {"criteria": "genre", "criteria_value": "Early Access", "game_count": 45, "success_count": 31, "success_rate": 0.6888888888888889}, {"criteria": "genre", "criteria_value": "RPG", "game_count": 64, "success_count": 44, "success_rate": 0.6875}, {"criteria": "genre", "criteria_value": "Action", "game_count": 102, "success_count": 70, "success_rate": 0.6862745098039216}, {"criteria": "genre", "criteria_value": "Indie", "game_count": 80, "success_count": 54, "success_rate": 0.675}, {"criteria": "genre", "criteria_value": "Sports", "game_count": 9, "success_count": 6, "success_rate": 0.6666666666666666}, {"criteria": "genre", "criteria_value": "Racing", "game_count": 5, "success_count": 3, "success_rate": 0.6}, {"criteria": "genre", "criteria_value": "Free To Play", "game_count": 13, "success_count": 6, "success_rate": 0.4615384615384615}, {"criteria": "genre", "criteria_value": "Massively Multiplayer", "game_count": 12, "success_count": 3, "success_rate": 0.25}], "category": [{"criteria": "category", "criteria_value": "Includes level editor", "game_count": 6, "success_count": 6, "success_rate": 1.0}, {"criteria": "category", "criteria_value": "LAN PvP", "game_count": 3, "success_count": 3, "success_rate": 1.0}, {"criteria": "category", "crite language_band", "criteria_value": "16_30", "game_count": 43, "success_count": 36, "success_rate": 0.8372093023255814}, {"criteria": "language_band", "criteria_value": "1_5", "game_count": 21, "success_count": 15, "success_rate": 0.7142857142857143}, {"criteria": "language_band", "criteria_value": "6_15", "game_count": 114, "success_count": 72, "success_rate": 0.631578947368421}], "platform_count": [{"criteria": "platform_count", "criteria_value": "2 platforms", "game_count": 31, "success_count": 23, "success_rate": 0.7419354838709677}, {"criteria": "platform_count", "criteria_value": "1 platforms", "game_count": 141, "success_count": 96, "success_rate": 0.6808510638297872}, {"criteria": "platform_count", "criteria_value": "3 platforms", "game_count": 6, "success_count": 4, "success_rate": 0.6666666666666666}], "multiplayer": [{"criteria": "multiplayer", "criteria_value": "no", "game_count": 83, "success_count": 62, "success_rate": 0.7469879518072289}, {"criteria": "multiplayer", "criteria_value": "yes", "game_count": 95, "success_count": 61, "success_rate": 0.6421052631578947}], "external_attention": [{"criteria": "external_attention", "criteria_value": "high", "game_count": 10, "success_count": 10, "success_rate": 1.0}, {"criteria": "external_attention", "criteria_value": "medium", "game_count": 2, "success_count": 2, "success_rate": 1.0}, {"criteria": "external_attention", "criteria_value": "none", "game_count": 166, "success_count": 111, "success_rate": 0.6686746987951807}]}, "summary": {"rows": 178, "success": 123, "failure": 55, "metrics": {"model": "random_forest", "accuracy": 0.6851851851851852, "precision": 0.7777777777777778, "recall": 0.7567567567567568, "f1": 0.7671232876712328, "roc_auc": 0.7503974562798092}, "conclusions": {"brief": "현재 표본 178개 중 성공 기준 충족 게임은 123개(69.1%)입니다. 이번 실행에서는 random_forest가 F1 0.767로 가장 높았고, 상위 장르 경향은 Casual (성공률 75.9%, n=29)입니다.", "detail": "이 모델은 실제 매출이 아니라 리뷰 500개 이상 및 긍정률 80% 이상이라는 운영상 성공 기준을 예측합니다. 현재 실행에서 random_forest는 Accuracy 0.685, F1 0.767로 선택됐습니다. Random Forest는 비선형 관계와 변수 상호작용을 다룰 수 있어 가격, 언어 수, 카테고리 수, 외부 관심도처럼 성격이 다른 변수를 함께 쓸 때 현재 실험에서는 적합합니다. 다만 표본 수가 작고 외부 관심도는 검색 결과 proxy이므로, 최종 보고서에서는 '현재 수집 표본에서 가장 성능이 좋았다'고 표현해야 합니다. 가격대 경향은 60_plus (성공률 88.9%, n=9), 외부 웹 관심도 경향은 high (성공률 100.0%, n=10)로 요약됩니다."}, "predicted_game": {"appid": 1903340, "name": "Clair Obscur: Expedition 33", "success": 1, "total_reviews": 267144, "positive_rate": 0.9540210523163536, "predicted_success_probability": 0.9365418593560432, "steam_url": "https://store.steampowered.com/app/1903340/"}, "review_topics": [{"genre": "Adventure", "game_success": "success", "review_sentiment": "positive", "review_count": 180, "top_terms": "game, ayy, ayy ayy, les, que, ella, et, 10"}, {"genre": "Adventure", "game_success": "success", "review_sentiment": "negative", "review_count": 18, "top_terms": "es, nie, ale, eine, game, ist, kt, na"}, {"genre": "Adventure", "game_success": "failure", "review_sentiment": "positive", "review_count": 75, "top_terms": "game, good, better, great, like, love, play, games"}, {"genre": "Adventure", "game_success": "failure", "review_sentiment": "negative", "review_count": 25, "top_terms": "game, para, um, ncia, que, em, jogo, experi"}, {"genre": "Action", "game_success": "success", "review_sentiment": "positive", "review_count": 261, "top_terms": "game, ayy, ayy ayy, les, que, like, 10, ella"}, {"genre": "Action", "game_success": "success", "review_sentiment": "negative", "review_count": 36, "top_terms": "game, pve, just, pvp, like, player, ai, time"}, {"genre": "Action", "game_success": "failure", "review_sentiment": "positive", "review_count": 98, "top_terms": "game, good, like, better, di, il, love, played"}, {"genre": "Action", "game_success": "failure", "review_sentiment": "negative", "review_count": 42, "top_terms": "game, para, um, really, ncia, que, good, play"}, {"genre": "Strategy", "game_success": "success", "review_sentiment": "positive", "review_count": 73, "top_terms": "game, factory, like, fun, 10, factory grow, grow, good"}, {"genre": "Strategy", "game_success": "success", "review_sentiment": "negative", "review_count": 6, "top_terms": "nie, ale, game, kt, na, pause, si, art"}, {"genre": "Strategy", "game_success": "failure", "review_sentiment": "positive", "review_count": 61, "top_terms": "game, di, il, good, great, love, non, play"}, {"genre": "Strategy", "game_success": "failure", "review_sentiment": "negative", "review_count": 19, "top_terms": "game, para, um, ncia, que, really, em, jogo"}], "figures": [{"src": "figures/label_distribution.png", "name": "label_distribution.png"}, {"src": "figures/reviews_vs_positive_rate.png", "name": "reviews_vs_positive_rate.png"}, {"src": "figures/feature_importance.png", "name": "feature_importance.png"}, {"src": "figures/analysis_workflow.png", "name": "analysis_workflow.png"}, {"src": "figures/review_topic_counts.png", "name": "review_topic_counts.png"}]}};
const summary = data.summary;
document.getElementById('briefConclusion').textContent = summary.conclusions.brief;
document.getElementById('detailConclusion').textContent = summary.conclusions.detail;
const predicted = summary.predicted_game || {};
document.getElementById('predictedGame').innerHTML = predicted.name ? `<h2>그래서 성공할 것으로 예측되는 게임은 뭔가?</h2><p><a href="${predicted.steam_url}" target="_blank" rel="noreferrer">${predicted.name}</a>입니다. 예측 성공 확률은 ${(Number(predicted.predicted_success_probability || 0) * 100).toFixed(1)}%이고, 현재 리뷰 ${Number(predicted.total_reviews || 0).toLocaleString()}개 / 긍정률 ${(Number(predicted.positive_rate || 0) * 100).toFixed(1)}%입니다.</p>` : '<h2>그래서 성공할 것으로 예측되는 게임은 뭔가?</h2><p>예측 결과 데이터가 없습니다.</p>';
document.getElementById('figures').innerHTML = (summary.figures || []).map(figure => `<figure><img src="${figure.src}" alt="${figure.name}"><figcaption class="small">${figure.name}</figcaption></figure>`).join('');
const topicRows = summary.review_topics || [];
document.getElementById('reviewTopics').innerHTML = topicRows.length ? `<table class="topic-table"><thead><tr><th>장르</th><th>성공/실패</th><th>긍정/부정</th><th>주요 토픽</th><th>리뷰 수</th></tr></thead><tbody>${topicRows.map(row => `<tr><td>${row.genre}</td><td>${row.game_success}</td><td>${row.review_sentiment}</td><td>${row.top_terms}</td><td>${row.review_count}</td></tr>`).join('')}</tbody></table>` : '<p>리뷰 토픽 데이터가 없습니다.</p>';
document.getElementById('summary').innerHTML = `<div class="card"><b>데이터</b>: ${summary.rows}개 게임, 성공 ${summary.success}개, 비성공 ${summary.failure}개<br><b>모델</b>: ${summary.metrics.model || ''}, F1=${Number(summary.metrics.f1 || 0).toFixed(3)}, Accuracy=${Number(summary.metrics.accuracy || 0).toFixed(3)}<p class="small">F1은 성공/실패 예측의 precision과 recall을 함께 보는 지표입니다.</p></div>`;
const controls = document.getElementById('controls');
Object.entries(data.labels).forEach(([key, label]) => {
  controls.insertAdjacentHTML('beforeend', `<label><input type="checkbox" checked value="${key}" onchange="render()"> ${label}</label>`);
});
function sectionHtml(key) {
  const rows = data.sections[key] || [];
  const label = data.labels[key];
  if (!rows.length) return `<div class="card"><h2>${label}</h2><p>표시할 데이터가 없습니다.</p></div>`;
  const bars = rows.map(row => {
    const rate = Number(row.success_rate || 0);
    const pct = Math.round(rate * 1000) / 10;
    return `<div class="bar-row"><div>${row.criteria_value}</div><div class="bar-bg"><div class="bar" style="width:${pct}%"></div></div><div>${pct}%</div></div><div class="small">성공 ${row.success_count} / 전체 ${row.game_count}</div>`;
  }).join('');
  return `<div class="card"><h2>${label}</h2>${bars}</div>`;
}
function render() {
  const selected = [...document.querySelectorAll('input[type=checkbox]:checked')].map(input => input.value);
  document.getElementById('sections').innerHTML = selected.map(sectionHtml).join('');
}
render();
</script>
</body>
